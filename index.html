<!DOCTYPE html>
<html lang="ja">
<head>

<!-- PWA・メタデータ設定：プログレッシブウェブアプリ化、アイコン登録 -->
<link rel="manifest" href="/alcohol-check.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルコールチェック報告</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-blue-600 text-white shadow-md p-4 text-center font-bold text-lg relative flex items-center justify-center">
    <span>安全運転管理システム</span>
    <button id="logoutBtn" class="hidden absolute right-4 bg-blue-700 hover:bg-blue-800 text-xs text-white font-bold py-1.5 px-3 rounded-lg transition border border-blue-500 shadow-sm">
      ログアウト
    </button>
  </header>

  <main class="flex-grow p-4 flex items-center justify-center">
    
    <div id="loginSection" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
      <h2 class="text-xl font-bold text-center mb-6 text-blue-600">ユーザーログイン</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">ログインID</label>
          <input type="text" id="loginId" class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例: driver01">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">パスワード</label>
          <input type="password" id="password" class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md mt-2">
          ログイン
        </button>
      </div>
    </div>

    <div id="formSection" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md hidden">
      <h2 class="text-xl font-bold text-center mb-6 text-slate-700">アルコール検査報告</h2>
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">測定日時</label>
          <input type="datetime-local" id="reportDateTime" class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">運転者氏名</label>
          <input type="text" id="userName" class="w-full border border-slate-200 rounded-lg p-3 bg-slate-100 text-slate-500 font-semibold" readonly>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">使用車両</label>
          <select id="carName" class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">最新データ取得中...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-slate-600">実施タイミング</label>
          <div class="flex gap-4">
            <label class="flex-1 flex items-center justify-center gap-2 border border-slate-300 rounded-lg p-3 cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-600 font-bold">
              <input type="radio" name="timing" value="前" checked class="accent-blue-600"> 運転前(自宅出発時)
            </label>
            <label class="flex-1 flex items-center justify-center gap-2 border border-slate-300 rounded-lg p-3 cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-600 font-bold">
              <input type="radio" name="timing" value="後" class="accent-blue-600"> 運転後（自宅到着時）
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">使用検知器番号</label>
          <select id="deviceNo" class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">最新データ取得中...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">測定結果 (mg/L)</label>
          <div class="relative flex items-center">
            <input type="number" id="resultValue" value="0.00" step="0.01" min="0" class="w-full border border-slate-300 rounded-lg p-3 text-right pr-16 text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
            <span class="absolute right-4 text-slate-400 font-medium">mg/L</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-slate-600 font-bold">酒気帯び判定</label>
          <div class="flex gap-4">
            <label id="labelNoAlcohol" class="flex-1 flex items-center justify-center gap-2 border border-slate-300 rounded-lg p-3 cursor-pointer has-[:checked]:bg-green-50 has-[:checked]:border-green-500 has-[:checked]:text-green-600 font-bold">
              <input type="radio" name="hasAlcohol" value="無し" checked class="accent-green-600"> 無し
            </label>
            <label id="labelHasAlcohol" class="flex-1 flex items-center justify-center gap-2 border border-slate-300 rounded-lg p-3 cursor-pointer has-[:checked]:bg-red-50 has-[:checked]:border-red-500 has-[:checked]:text-red-600 font-bold">
              <input type="radio" name="hasAlcohol" value="有" class="accent-red-600"> 有り
            </label>
          </div>
        </div>

        <button id="previewBtn" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-lg transition shadow-md mt-4">
          入力内容を確認する（プレビュー）
        </button>
      </div>
    </div>
  </main>

  <div id="previewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0 duration-200" id="modalCard">
      <div class="bg-slate-800 text-white p-4 font-bold text-center">
        💡 報告内容の確認
      </div>
      <div class="p-6 space-y-4">
        <p class="text-sm text-slate-500 border-b pb-2">以下の内容で管理システムへ報告を送信します。間違いがないかご確認ください。</p>
        
        <table class="w-full text-left border-collapse text-sm">
          <tbody>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium w-1/3">日時</th><td id="pDateTime" class="py-2.5 font-bold"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">氏名</th><td id="pName" class="py-2.5 font-bold"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">使用車両</th><td id="pCar" class="py-2.5 font-bold"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">タイミング</th><td id="pTiming" class="py-2.5 font-bold"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">検知器番号</th><td id="pDevice" class="py-2.5 font-bold"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">測定値</th><td id="pResult" class="py-2.5 text-lg text-blue-600 font-black"></td></tr>
            <tr class="border-b"><th class="py-2.5 text-slate-500 font-medium">酒気帯び</th><td id="pAlcohol" class="py-2.5 font-black"></td></tr>
          </tbody>
        </table>

        <div class="flex gap-3 pt-4">
          <button id="modalModifyBtn" class="flex-1 border-2 border-slate-300 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-50 transition">
            修正する
          </button>
          <button id="modalSubmitBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition">
            報告する
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-xs text-slate-400 p-3 bg-slate-200">
    &copy; 2026 Alcohol Checker System.
  </footer>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbye6VEXwclrTVEg6buiGWRlS79o1uSMUlW5vsPk60HHPrIWFCpyeatgfo-xnRZX5n9Kag/exec";
    const STORAGE_KEY = "alcohol_checker_user_session";

    let currentUser = { userId: "", userName: "" };

    const loginSection = document.getElementById("loginSection");
    const formSection = document.getElementById("formSection");
    const previewModal = document.getElementById("previewModal");
    const modalCard = document.getElementById("modalCard");
    const logoutBtn = document.getElementById("logoutBtn");

    function setInitialDateTime() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(now.getTime() - offset)).toISOString().slice(0, 16);
      document.getElementById("reportDateTime").value = localISOTime;
    }

    document.getElementById("resultValue").addEventListener("input", (e) => {
      const val = parseFloat(e.target.value) || 0;
      if (val > 0) {
        document.querySelector('input[name="hasAlcohol"][value="有"]').checked = true;
      } else {
        document.querySelector('input[name="hasAlcohol"][value="無し"]').checked = true;
      }
    });

    // 🌟 変更：ドロップダウン部分の生成ロジックのみを関数として独立化
    function updateDropdowns(userData) {
      const carSelect = document.getElementById("carName");
      carSelect.innerHTML = ""; 
      if (userData.allCars && userData.allCars.length > 0) {
        userData.allCars.forEach(car => {
          const opt = document.createElement("option");
          opt.value = car; opt.textContent = car;
          if (car === userData.defaultCar) opt.selected = true;
          carSelect.appendChild(opt);
        });
      } else {
        carSelect.innerHTML = '<option value="">車両データがありません</option>';
      }

      const deviceSelect = document.getElementById("deviceNo");
      deviceSelect.innerHTML = "";
      if (userData.allDevices && userData.allDevices.length > 0) {
        userData.allDevices.forEach(device => {
          const opt = document.createElement("option");
          opt.value = device; opt.textContent = device;
          if (device === userData.defaultDevice) opt.selected = true;
          deviceSelect.appendChild(opt);
        });
      } else {
        deviceSelect.innerHTML = '<option value="">検知器データがありません</option>';
      }
    }

    // 初回ログイン成功時の画面構築
    function initFormFields(userData) {
      currentUser.userId = userData.userId;
      currentUser.userName = userData.userName;

      document.getElementById("userName").value = userData.userName;
      setInitialDateTime();

      // ドロップダウンを生成
      updateDropdowns(userData);

      loginSection.classList.add("hidden");
      formSection.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
    }

    // 🌟 変更：ページ読み込み時（自動ログイン時）の挙動
    window.addEventListener("DOMContentLoaded", async () => {
      const savedSession = localStorage.getItem(STORAGE_KEY);
      if (savedSession) {
        try {
          const session = JSON.parse(savedSession);
          
          // 1. まずは手元にある「氏名」を使って、待たせることなくフォーム画面を表示
          currentUser.userId = session.userId;
          currentUser.userName = session.userName;
          document.getElementById("userName").value = session.userName;
          setInitialDateTime();
          
          loginSection.classList.add("hidden");
          formSection.classList.remove("hidden");
          logoutBtn.classList.remove("hidden");

          // リストは一旦「取得中」表示にする
          document.getElementById("carName").innerHTML = '<option value="">最新データ取得中...</option>';
          document.getElementById("deviceNo").innerHTML = '<option value="">最新データ取得中...</option>';

          // 2. 裏（バックグラウンド）で自動的にGASへ通信し、最新のマスターリストを取得
          const response = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "login",
              payload: { loginId: session.loginId, password: session.password }
            })
          });

          const result = await response.json();

          if (result.status === "success") {
            // 3. 最新のリストが届いたら、ドロップダウンをそっと上書き更新
            updateDropdowns(result.data);
            
            // ユーザー情報に変更があった場合のために、ストレージも最新状態に更新
            const updatedSession = {
              loginId: session.loginId,
              password: session.password,
              userName: result.data.userName,
              userId: result.data.userId
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedSession));
          } else {
            // 万が一パスワード変更などで認証が通らなくなっていた場合は初期化
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
          }
        } catch (e) {
          console.error("自動ログイン・最新リストの都度取得に失敗しました。", e);
          document.getElementById("carName").innerHTML = '<option value="">データ取得失敗（再読込してください）</option>';
          document.getElementById("deviceNo").innerHTML = '<option value="">データ取得失敗（再読込してください）</option>';
        }
      }
    });

    logoutBtn.addEventListener("click", () => {
      if (confirm("ログアウト（ユーザー切替）しますか？")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const id = document.getElementById("loginId").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!id || !pass) {
        alert("IDとパスワードを入力してください。");
        return;
      }

      document.getElementById("loginBtn").innerText = "認証中...";
      document.getElementById("loginBtn").disabled = true;

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "login",
            payload: { loginId: id, password: pass }
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          // 🌟 変更：マスタデータそのものは保存せず、認証情報（ID・パスワード等）のみをストレージに記憶
          const sessionData = {
            loginId: id,
            password: pass,
            userName: result.data.userName,
            userId: result.data.userId
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
          
          initFormFields(result.data);
        } else {
          alert("ログイン失敗: " + result.message);
        }
      } catch (err) {
        alert("通信エラーが発生しました。");
        console.error(err);
      } finally {
        document.getElementById("loginBtn").innerText = "ログイン";
        document.getElementById("loginBtn").disabled = false;
      }
    });

    document.getElementById("previewBtn").addEventListener("click", () => {
      const dt = document.getElementById("reportDateTime").value.replace("T", " ");
      const name = document.getElementById("userName").value;
      const car = document.getElementById("carName").value;
      const timing = document.querySelector('input[name="timing"]:checked').value;
      const device = document.getElementById("deviceNo").value;
      const resVal = parseFloat(document.getElementById("resultValue").value || 0).toFixed(2);
      const alcohol = document.querySelector('input[name="hasAlcohol"]:checked').value;

      if (!car) { return alert("使用車両を選択してください。"); }
      if (!device) { return alert("使用検知器番号を選択してください。"); }

      document.getElementById("pDateTime").textContent = dt;
      document.getElementById("pName").textContent = name;
      document.getElementById("pCar").textContent = car;
      document.getElementById("pTiming").textContent = `運転${timing}`;
      document.getElementById("pDevice").textContent = device;
      document.getElementById("pResult").textContent = `${resVal} mg/L`;
      
      const alcoholTd = document.getElementById("pAlcohol");
      alcoholTd.textContent = alcohol;
      if (alcohol === "有") {
        alcoholTd.className = "py-2.5 font-black text-red-600 animate-pulse";
      } else {
        alcoholTd.className = "py-2.5 font-black text-green-600";
      }

      document.body.classList.add("modal-open");
      previewModal.classList.remove("hidden");
      setTimeout(() => {
        modalCard.classList.remove("scale-95", "opacity-0");
        modalCard.classList.add("scale-100", "opacity-100");
      }, 5);
    });

    document.getElementById("modalModifyBtn").addEventListener("click", () => {
      modalCard.classList.remove("scale-100", "opacity-100");
      modalCard.classList.add("scale-95", "opacity-0");
      setTimeout(() => {
        previewModal.classList.add("hidden");
        document.body.classList.remove("modal-open");
      }, 150);
    });

    document.getElementById("modalSubmitBtn").addEventListener("click", async () => {
      const submitBtn = document.getElementById("modalSubmitBtn");
      submitBtn.innerText = "送信中...";
      submitBtn.disabled = true;

      const payload = {
        currentUserName: currentUser.userName,
        userId: currentUser.userId,
        reportDateTime: document.getElementById("reportDateTime").value.replace("T", " "),
        carName: document.getElementById("carName").value,
        timing: document.querySelector('input[name="timing"]:checked').value,
        deviceNo: document.getElementById("deviceNo").value,
        resultValue: parseFloat(document.getElementById("resultValue").value || 0).toFixed(2),
        hasAlcohol: document.querySelector('input[name="hasAlcohol"]:checked').value
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveReport",
            payload: payload
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("🎉 報告が正常にスプレッドシートに記録されました。");
          document.getElementById("modalModifyBtn").click();
          document.getElementById("resultValue").value = "0.00";
          document.querySelector('input[name="hasAlcohol"][value="無し"]').checked = true;
          setInitialDateTime();
        } else {
          alert("送信エラー: " + result.message);
        }
      } catch (err) {
        alert("サーバーとの通信に失敗しました。再度お試しください。");
        console.error(err);
      } finally {
        submitBtn.innerText = "報告する";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
